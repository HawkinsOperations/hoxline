name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  hoxline-trust-boundaries:
    runs-on: ubuntu-latest
    env:
      HAWKINS_COMMAND_CENTER_IMMUTABLE_OBSERVED_SHA: b87acd4487ff779bc0cb8b96c783ada0d712a0ed
      HAWKINS_HOXLINE_EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out Hoxline PR revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: org/hoxline
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out command center
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/.github
          ref: b87acd4487ff779bc0cb8b96c783ada0d712a0ed
          path: org/.github
          fetch-depth: 0
          persist-credentials: false

      - name: Check out detection authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-detections
          ref: 015a9dc359b3fa4c4853cd1b18372c3e44eacec9
          path: org/hawkinsoperations-detections
          fetch-depth: 0
          persist-credentials: false

      - name: Check out validation authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-validation
          ref: 03d8b909b2304a9a570129a559f9cd44e98dc2b1
          path: org/hawkinsoperations-validation
          fetch-depth: 0
          persist-credentials: false

      - name: Check out platform authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-platform
          ref: 26ae0fd0112d2123f90197b9aa5078db0d35db65
          path: org/hawkinsoperations-platform
          fetch-depth: 0
          persist-credentials: false

      - name: Check out proof authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-proof
          ref: 79d4bff2dccb24c2b29a68f4a3be7a1e916414b4
          path: org/hawkinsoperations-proof
          fetch-depth: 0
          persist-credentials: false

      - name: Check out website rendering contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-website
          ref: 5ee3fe553e78ca35b3a2422b2231c627c1ee1f99
          path: org/hawkinsoperations-website
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and record exact seven-repository checkout
        working-directory: org/hoxline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          root = Path("..").resolve()
          expected = [
              ".github",
              "hawkinsoperations-detections",
              "hawkinsoperations-validation",
              "hawkinsoperations-platform",
              "hawkinsoperations-proof",
              "hawkinsoperations-website",
              "hoxline",
          ]
          immutable = {
              ".github": "b87acd4487ff779bc0cb8b96c783ada0d712a0ed",
              "hawkinsoperations-detections": "015a9dc359b3fa4c4853cd1b18372c3e44eacec9",
              "hawkinsoperations-validation": "03d8b909b2304a9a570129a559f9cd44e98dc2b1",
              "hawkinsoperations-platform": "26ae0fd0112d2123f90197b9aa5078db0d35db65",
              "hawkinsoperations-proof": "79d4bff2dccb24c2b29a68f4a3be7a1e916414b4",
              "hawkinsoperations-website": "5ee3fe553e78ca35b3a2422b2231c627c1ee1f99",
              "hoxline": os.environ["HAWKINS_HOXLINE_EVENT_SHA"],
          }
          actual = sorted(path.name for path in root.iterdir() if (path / ".git").exists())
          if actual != sorted(expected):
              raise SystemExit(f"exact seven-repository checkout required; expected={sorted(expected)}, actual={actual}")
          for name in expected:
              sha = subprocess.check_output(
                  ["git", "-C", str(root / name), "rev-parse", "HEAD"],
                  text=True,
              ).strip()
              print(f"{name}={sha}")
              if sha != immutable[name]:
                  raise SystemExit(
                      f"{name} checkout mismatch: expected {immutable[name]}, got {sha}"
                  )
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and declared test dependencies
        working-directory: org/hoxline
        run: |
          python -m pip install -e ".[test]"

      - name: Compile
        working-directory: org/hoxline
        run: python -B -m compileall src tests

      - name: Reject retired tracked vocabulary
        working-directory: org/hoxline
        run: |
          python -B - <<'PY'
          from pathlib import Path
          from hoxline.review_engine import verify_tracked_vocabulary

          errors = verify_tracked_vocabulary(Path("."))
          if errors:
              raise SystemExit("\n".join(errors))
          print("Tracked vocabulary verification: PASS")
          PY

      - name: Run unittest suite
        working-directory: org/hoxline
        run: python -B -m unittest discover -s tests

      - name: Run full pytest suite including hostile replay cases
        working-directory: org/hoxline
        run: python -B -m pytest

      - name: Generate Case Growth pair from exact seven checked sources
        working-directory: org/hoxline
        run: >-
          python -B -m hoxline.cli case-growth index
          --repo-root ..
          --format json
          --paired-output-base "${{ runner.temp }}/current-case-growth-index"

      - name: Verify checked Case Growth pair
        working-directory: org/hoxline
        run: >-
          python -B -m hoxline.cli case-growth verify
          --repo-root ..
          --snapshot examples/case-growth/current-case-growth-index.json

      - name: Diff checked Case Growth pair
        working-directory: org/hoxline
        run: >-
          python -B -m hoxline.cli case-growth diff
          --repo-root ..
          --snapshot examples/case-growth/current-case-growth-index.json
          --format json

      - name: Run expanded batch and verify complete replay
        working-directory: org/hoxline
        run: |
          python -B -m hoxline review batch run \
            --index examples/review/multi-artifact-review-index-v1.json \
            --output "${{ runner.temp }}/hoxline-batch" \
            --force
          python -B -m hoxline review batch verify \
            --run "${{ runner.temp }}/hoxline-batch/batch-machine-state.json"

      - name: Run one-command reviewer demo
        working-directory: org/hoxline
        run: >-
          python -B -m hoxline demo quickstart
          --output "${{ runner.temp }}/hoxline-demo"
          --force

      - name: Passing Claim Firewall example succeeds
        working-directory: org/hoxline
        run: python -m claimfirewall scan examples/pass.md --policy policy/blocked_claims.yml

      - name: Failing Claim Firewall example is rejected
        working-directory: org/hoxline
        run: |
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "claimfirewall",
                  "scan",
                  "examples/fail.md",
                  "--policy",
                  "policy/blocked_claims.yml",
              ],
              check=False,
          )
          if result.returncode != 1:
              raise SystemExit(f"expected blocked example exit 1, got {result.returncode}")
          PY

      - name: Safe context docs succeed
        working-directory: org/hoxline
        run: python -m claimfirewall scan README.md CLAIM_BOUNDARY.md --policy policy/blocked_claims.yml

      - name: Reject legacy product naming
        working-directory: org/hoxline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r"c[l]aimlint", re.IGNORECASE)
          hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              if pattern.search(text):
                  hits.append(path.as_posix())
          if hits:
              raise SystemExit(f"legacy product naming found: {hits}")
          PY

      - name: Verify no tracked drift
        working-directory: org/hoxline
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
